name: Update and Deploy HousingCycle Dashboard

on:
  push:
    branches: ["main"]
    paths:
      - "reports/**"
      - "data/manual/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/pages.yml"
  schedule:
    # 20th day every month, 10:00 Beijing time / 02:00 UTC.
    # Most PBOC/NBS monthly data is normally released by then.
    - cron: "0 2 20 * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        if: github.event_name != 'push'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        if: github.event_name != 'push'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run monthly update
        if: github.event_name != 'push'
        run: python scripts/run_monthly_update.py

      - name: Commit updated dashboard and database
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports data/manual data/housing_cycle.sqlite
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "monthly housing-cycle update"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload reports artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
